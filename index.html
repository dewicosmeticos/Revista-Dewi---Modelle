<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dewi Cosméticos & Perfumaria Premium</title>
<meta name="description" content="Perfumes árabes e skincare coreano. Conheça nossa loja online e nosso Instagram.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #F6EEDC;
    --arco: #FFFDF8;
    --ouro: #C6A15B;
    --ouro-escuro: #9E7A35;
    --cafe: #4A3728;
    --texto-botao: #FFFFFF;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--fundo);
    color: var(--cafe);
    font-family: "Marcellus", Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    min-height: 100vh;
  }
  .arco {
    width: 100%;
    max-width: 380px;
    background: var(--arco);
    border: 1.5px solid var(--ouro);
    border-radius: 190px 190px 18px 18px;
    padding: 72px 32px 40px;
    text-align: center;
    position: relative;
    outline: 1px solid var(--ouro);
    outline-offset: 7px;
  }
  .marca { margin: 0 auto; }
  .marca img { display: block; width: 62%; max-width: 210px; height: auto; margin: 0 auto; }
  .subtitulo {
    margin-top: 14px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--ouro-escuro);
  }
  .estrela {
    color: var(--ouro);
    margin: 26px 0 22px;
    font-size: 14px;
  }
  .frase {
    font-size: 20px;
    line-height: 1.6;
  }
  .links {
    margin-top: 34px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .botao {
    display: block;
    padding: 16px 20px;
    border-radius: 999px;
    font-family: "Marcellus", Georgia, serif;
    font-size: 17px;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .botao-loja {
    background: var(--ouro);
    color: var(--texto-botao);
  }
  .botao-insta {
    border: 1.5px solid var(--ouro);
    color: var(--cafe);
  }
  .botao:hover { transform: translateY(-1px); }
  .botao:active { transform: scale(0.98); }
  .botao:focus-visible { outline: 3px solid var(--cafe); outline-offset: 3px; }
  .rodape {
    margin-top: 30px;
    font-size: 13px;
    color: var(--ouro-escuro);
  }
  @media (prefers-reduced-motion: reduce) {
    .botao { transition: none; }
  }
</style>
</head>
